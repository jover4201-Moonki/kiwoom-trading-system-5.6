[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "kiwoom-trading-system"
version = "0.1.0"
description = "Kiwoom REST API and WebSocket based short-term trading support system"
requires-python = ">=3.13"
dependencies = [
    "kwcli==1.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[[tool.uv.index]]
url = "https://pypi.org/simple"

[tool.setuptools.packages.find]
where = ["src"]
